[package]
name = "dh-protocol"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chacha20 = { version = "0.9", features = ["zeroize"] }
poly1305 = { version = "0.8", features = ["zeroize"] }
subtle = "2.6"
siphasher = "1"
zeroize = "1.8"

tokio = { version = "1", features = ["sync", "net", "time"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ruzstd = "0.9"
ed25519-dalek = { version = "2", features = ["rand_core"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "rand_core", "salsa20", "seal"] }
base64 = "0.22"
lz4_flex = { version = "0.12", default-features = false, features = ["std", "safe-encode", "safe-decode"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
