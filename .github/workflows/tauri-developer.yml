name: DH BOT Developer Fixture
run-name: DH BOT internal developer build - ${{ github.ref_name }}

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tauri3/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify production build boundary
        run: pnpm verify:production:boundary
      - name: Test production isolation scanner
        run: pnpm test:production-isolation
      - name: Test Contract v2 sanitizer
        run: pnpm test:contract-sanitizer
      - name: Test React pages and interactions
        run: pnpm test:ui
      - run: pnpm test:fixture
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features fixture --all-targets -- -D warnings
      - name: Install developer browser test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Test developer Fixture workflows
        run: pnpm test:e2e:fixture
      - run: pnpm tauri:build:developer
      - run: pnpm package:windows:developer
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: DH-BOT-dev-windows-x64-${{ github.sha }}
          path: |
            tauri3/dist/DH-BOT-*-dev-windows-x64.zip
            tauri3/src-tauri/target/release/bundle/nsis/*.exe
