name: DH BOT Windows
run-name: DH BOT Windows production - ${{ github.ref_name }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tauri3/**"
      - ".github/workflows/tauri-windows.yml"
  push:
    tags:
      - "v3.*"
    paths:
      - "tauri3/**"
      - ".github/workflows/tauri-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tauri3/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify production build boundary
        run: pnpm verify:production:boundary
      - name: Test production isolation scanner
        run: pnpm test:production-isolation
      - name: Test Contract v2 sanitizer
        run: pnpm test:contract-sanitizer
      - name: Test React pages and interactions
        run: pnpm test:ui
      - run: pnpm test:production
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
      - name: Prepare Authenticode certificate
        if: startsWith(github.ref, 'refs/tags/v3.')
        shell: pwsh
        env:
          DH_SIGN_PFX_B64: ${{ secrets.DH_SIGN_PFX_B64 }}
          DH_SIGN_PASSWORD_SECRET: ${{ secrets.DH_SIGN_PASSWORD }}
        run: |
          if (-not $env:DH_SIGN_PFX_B64) { throw '正式标签发布缺少 DH_SIGN_PFX_B64' }
          $path = Join-Path $env:RUNNER_TEMP 'dh-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:DH_SIGN_PFX_B64))
          "DH_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DH_SIGN_PASSWORD=$env:DH_SIGN_PASSWORD_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build production PE without bundling
        shell: pwsh
        run: |
          pnpm clean:production
          pnpm exec tauri build --no-bundle --ci --features custom-protocol -- --no-default-features
      - name: Sign production PE before NSIS
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'src-tauri\target\release\dh-bot.exe'
          if (-not (Test-Path $exe)) { throw "缺少主程序：$exe" }
          if ($env:DH_SIGN_PFX) {
            $args = @('sign', '/fd', 'SHA256', '/tr', 'http://timestamp.digicert.com', '/td', 'SHA256', '/f', $env:DH_SIGN_PFX)
            if ($env:DH_SIGN_PASSWORD) { $args += @('/p', $env:DH_SIGN_PASSWORD) }
            $args += $exe
            & signtool @args
            if ($LASTEXITCODE -ne 0) { throw '主程序 Authenticode 签名失败' }
            & signtool verify /pa /all $exe
            if ($LASTEXITCODE -ne 0) { throw '主程序 Authenticode 校验失败' }
          } elseif ($env:GITHUB_REF -like 'refs/tags/v3.*') {
            throw '正式标签发布必须配置 Authenticode 证书'
          }
      - name: Bundle NSIS with signed production PE
        shell: pwsh
        run: pnpm exec tauri bundle --ci --no-sign
      - name: Package and deeply scan production artifacts
        shell: pwsh
        run: pnpm package:windows:production
      - name: Recheck Windows production artifacts
        run: pnpm verify:windows:production
      - uses: actions/upload-artifact@v4
        with:
          name: DH-BOT-windows-production-${{ github.sha }}
          path: |
            tauri3/dist/production/*
            tauri3/dist/DH-BOT-*-windows-x64-portable.zip
      - name: Prepare release repository SSH key
        if: startsWith(github.ref, 'refs/tags/v3.')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DH_RELEASE_DEPLOY_KEY }}
      - name: Stage signed production release in public repository
        if: startsWith(github.ref, 'refs/tags/v3.')
        shell: pwsh
        env:
          DH_RELEASE_REPOSITORY: sh492773746/d-hbot-releases
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SSH_AUTH_SOCK) { throw 'DH_RELEASE_DEPLOY_KEY 未加载' }
          $tag = $env:GITHUB_REF_NAME
          $source = Join-Path $env:GITHUB_WORKSPACE 'tauri3\dist\production'
          $portable = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'tauri3\dist') -Filter 'DH-BOT-*-windows-x64-portable.zip' | Select-Object -First 1
          if (-not $portable) { throw '缺少便携版 ZIP' }
          $checkout = Join-Path $env:RUNNER_TEMP 'd-hbot-releases'
          Remove-Item $checkout -Recurse -Force -ErrorAction SilentlyContinue
          git clone --depth 1 "git@github.com:$env:DH_RELEASE_REPOSITORY.git" $checkout
          if ($LASTEXITCODE -ne 0) { throw '公开发行仓库检出失败' }
          $incoming = Join-Path $checkout "incoming\$tag"
          if (Test-Path $incoming) { throw "公开发行仓库已存在待发布版本：$tag" }
          New-Item -ItemType Directory -Force -Path $incoming | Out-Null
          Get-ChildItem $source -File | ForEach-Object { Copy-Item $_.FullName (Join-Path $incoming $_.Name) }
          Copy-Item $portable.FullName (Join-Path $incoming $portable.Name)
          $files = @(Get-ChildItem $incoming -File | Sort-Object Name | Select-Object -ExpandProperty Name)
          $manifest = [ordered]@{
            schema = 1
            tag = $tag
            sourceRepository = 'sh492773746/d-hbot'
            sourceCommit = $env:GITHUB_SHA
            createdAt = [DateTime]::UtcNow.ToString('o')
            files = $files
          } | ConvertTo-Json -Depth 3
          $manifest | Set-Content (Join-Path $incoming 'release.json') -Encoding utf8
          git -C $checkout config user.name 'dh-bot-release-bot'
          git -C $checkout config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $checkout add "incoming/$tag"
          git -C $checkout commit -m "stage: DH BOT $tag"
          git -C $checkout push origin main
          if ($LASTEXITCODE -ne 0) { throw '公开发行仓库推送失败' }
